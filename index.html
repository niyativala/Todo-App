<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      *{
        background-color: rgb(151, 107, 199);
      }
      .text{
        color: black;
      }
    </style>
  </head>
  <body>
    <h1 style="color: black;">To do App</h1>
    <h3 class="text">Enter "list" to show all tasks</h3>
    <h3 class="text">Enter "add" to add all tasks</h3>
    <h3 class="text">Enter "delete" to remove all tasks</h3>
    <h3 class="text">Enter "quit" to quit todo</h3>

    <script src="app.js"></script>
  </body>
</html>
